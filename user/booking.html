<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ยืนยันการจอง - วิน100</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#F59E0B',
                            dark: '#D97706',
                            light: '#FBBF24'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-800 pb-20 md:pb-6">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200/80 h-14 sm:h-16 flex items-center justify-between px-4 sm:px-6 sticky top-0 z-30 shadow-sm">
        <div class="flex items-center space-x-3">
            <a href="dashboard.html" class="p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="text-base font-black text-slate-900 tracking-tight">ยืนยันการเรียกรถ</h1>
                <p class="text-[10px] text-slate-500 font-semibold">Booking Details & Payment</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-xl w-full mx-auto p-4 sm:p-6 space-y-5 flex-grow">
        
        <!-- Route Summary Card -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-4">
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-wider">เส้นทางการเดินทาง</h2>
            
            <div class="space-y-4 relative">
                <div class="absolute left-[11px] top-6 bottom-6 w-0.5 bg-slate-200"></div>

                <div class="flex items-start space-x-3.5 relative">
                    <div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 mt-0.5 z-10 border-2 border-white">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                    </div>
                    <div class="min-w-0 flex-grow">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">จุดรับ</p>
                        <p id="pickupName" class="text-xs sm:text-sm font-bold text-slate-800 truncate">กำลังโหลด...</p>
                    </div>
                </div>

                <div class="flex items-start space-x-3.5 relative">
                    <div class="w-6 h-6 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0 mt-0.5 z-10 border-2 border-white">
                        <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
                    </div>
                    <div class="min-w-0 flex-grow">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">จุดส่ง</p>
                        <p id="destinationName" class="text-xs sm:text-sm font-bold text-slate-800 truncate">กำลังโหลด...</p>
                    </div>
                </div>
            </div>

            <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 font-medium">
                <div class="flex items-center space-x-1">
                    <i data-lucide="route" class="w-4 h-4 text-slate-400"></i>
                    <span>ระยะทางประมาณ: <strong id="distanceText" class="text-slate-800">0.0 กม.</strong></span>
                </div>
                <div class="flex items-center space-x-1">
                    <i data-lucide="clock" class="w-4 h-4 text-slate-400"></i>
                    <span>เวลาโดยประมาณ: <strong id="durationText" class="text-slate-800">0 นาที</strong></span>
                </div>
            </div>
        </div>

        <!-- Service Option -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-3">
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-wider">ประเภทบริการ</h2>
            <div class="p-4 bg-amber-50/60 border-2 border-primary rounded-2xl flex items-center justify-between">
                <div class="flex items-center space-x-3.5">
                    <div class="w-12 h-12 bg-primary text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-md shadow-amber-500/20">
                        <i data-lucide="bike" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-black text-sm text-slate-900">วินมอเตอร์ไซค์</h3>
                        <p class="text-[11px] text-slate-500 font-medium">รวดเร็ว คล่องตัว เหมาะสำหรับชั่วโมงเร่งด่วน</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Payment Method Options -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-3">
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-wider">วิธีการชำระเงิน</h2>
            <div class="grid grid-cols-2 gap-3">
                <label class="cursor-pointer">
                    <input type="radio" name="payment_method" value="cash" checked class="peer hidden">
                    <div class="p-3.5 border-2 border-slate-200 rounded-2xl text-center peer-checked:border-primary peer-checked:bg-amber-50/50 transition flex flex-col items-center space-y-1.5">
                        <i data-lucide="banknote" class="w-5 h-5 text-slate-600 peer-checked:text-primary"></i>
                        <span class="text-xs font-bold text-slate-700">เงินสด (Cash)</span>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="payment_method" value="qr" class="peer hidden">
                    <div class="p-3.5 border-2 border-slate-200 rounded-2xl text-center peer-checked:border-primary peer-checked:bg-amber-50/50 transition flex flex-col items-center space-y-1.5">
                        <i data-lucide="qr-code" class="w-5 h-5 text-slate-600 peer-checked:text-primary"></i>
                        <span class="text-xs font-bold text-slate-700">สแกนจ่าย (PromptPay)</span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Fare & Submit Card -->
        <div class="bg-slate-900 text-white rounded-3xl p-5 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">ยอดชำระสุทธิ</p>
                    <p class="text-2xl font-black text-amber-400" id="totalPrice">฿0</p>
                </div>
                <div class="text-right">
                    <span class="text-[10px] px-2.5 py-1 bg-amber-400/10 text-amber-400 rounded-full font-bold border border-amber-400/20">คำนวณตามระยะทาง</span>
                </div>
            </div>

            <button id="btnConfirmBooking" onclick="confirmBooking()" class="w-full py-4 bg-primary hover:bg-primary-dark active:scale-[0.98] text-white font-black rounded-2xl shadow-lg shadow-amber-500/25 transition text-sm flex items-center justify-center space-x-2">
                <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                <span>ยืนยันเรียกรถทันที</span>
            </button>
        </div>

    </main>

    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let currentUser = null;
        let bookingData = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const auth = await checkAuth('user');
            if (!auth) return;
            currentUser = auth.profile;
            lucide.createIcons();

            // ดึงข้อมูลการจองจาก SessionStorage
            let storedData = sessionStorage.getItem('pendingBooking');
            
            if (!storedData) {
                // ข้อมูลจำลองกรณีเปิดเข้าหน้านี้โดยตรง
                bookingData = {
                    pickup: 'อนุสาวรีย์ชัยสมรภูมิ',
                    pickup_lat: 13.7649,
                    pickup_lng: 100.5383,
                    destination: 'สยามพารากอน',
                    dest_lat: 13.7460,
                    dest_lng: 100.5347,
                    distance: 2.5,
                    duration: 10,
                    price: 45
                };
                sessionStorage.setItem('pendingBooking', JSON.stringify(bookingData));
            } else {
                bookingData = JSON.parse(storedData);
            }

            // แสดงผลข้อมูลบนหน้าจอ
            document.getElementById('pickupName').textContent = bookingData.pickup || 'ไม่ระบุจุดรับ';
            document.getElementById('destinationName').textContent = bookingData.destination || 'ไม่ระบุจุดส่ง';
            document.getElementById('distanceText').textContent = `${(bookingData.distance || 0).toFixed(1)} กม.`;
            document.getElementById('durationText').textContent = `${bookingData.duration || 5} นาที`;
            document.getElementById('totalPrice').textContent = formatCurrency(bookingData.price || 0);
        });

        async function confirmBooking() {
            if (!bookingData || !currentUser) return;

            const btn = document.getElementById('btnConfirmBooking');
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>กำลังสร้างรายการ...</span>`;
            lucide.createIcons();

            const selectedPayment = document.querySelector('input[name="payment_method"]:checked')?.value || 'cash';

            // บันทึก Job เข้าสู่ Supabase Table: jobs
            const { data, error } = await supabaseClient
                .from('jobs')
                .insert([
                    {
                        customer_id: currentUser.id,
                        pickup: bookingData.pickup,
                        pickup_latitude: bookingData.pickup_lat,
                        pickup_longitude: bookingData.pickup_lng,
                        destination: bookingData.destination,
                        destination_latitude: bookingData.dest_lat,
                        destination_longitude: bookingData.dest_lng,
                        distance: bookingData.distance,
                        price: bookingData.price,
                        payment_method: selectedPayment,
                        status: 'waiting'
                    }
                ])
                .select();

            if (error) {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="check-circle-2" class="w-5 h-5"></i><span>ยืนยันเรียกรถทันที</span>`;
                lucide.createIcons();
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: error.message });
                return;
            }

            sessionStorage.removeItem('pendingBooking');
            Swal.fire({
                icon: 'success',
                title: 'เรียกรถเรียบร้อยแล้ว!',
                text: 'กำลังนำคุณไปที่หน้าติดตามสถานะงาน',
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                window.location.href = 'active-job.html';
            });
        }
    </script>
</body>
</html>
