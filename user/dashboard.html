    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-leaflet-marker { background: none; border: none; }
        .user-pulse-marker {
            width: 20px;
            height: 20px;
            background: #2563EB;
            border: 3px solid #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
            position: relative;
        }
        .user-pulse-marker::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.35);
            animation: pulse-ring 1.8s infinite ease-out;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script>
        let currentUser = null;
        let userLat = 13.7563;
        let userLng = 100.5018;
        let destLat = null;
        let destLng = null;
        let estimatedDistance = 0;
        let estimatedPrice = 0;
        let routeLayer = null;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        function requestLocationPermission() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('เบราว์เซอร์ไม่รองรับ GPS'));
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (position) => resolve(position.coords),
                        (error) => reject(error),
                        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                    );
                }
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const auth = await checkAuth('user');
            if (!auth) return;
            currentUser = auth.profile;
            document.getElementById('greetingText').innerText = `สวัสดี, คุณ${currentUser.full_name || 'ผู้ใช้งาน'}`;

            leafletMap = L.map('map', { zoomControl: false }).setView([userLat, userLng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(leafletMap);

            L.control.zoom({ position: 'bottomright' }).addTo(leafletMap);
            lucide.createIcons();

            setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 300);

            leafletMap.on('click', async (e) => {
                const { lat, lng } = e.latlng;
                document.getElementById('destinationText').innerText = 'กำลังโหลดข้อมูลสถานที่...';
                
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=th`);
                    const data = await res.json();
                    const placeName = data.display_name || `หมุดพิกัด (${lat.toFixed(5)}, ${lng.toFixed(5)})`;
                    selectDestination(lat, lng, placeName);
                } catch (err) {
                    selectDestination(lat, lng, `หมุดพิกัด (${lat.toFixed(5)}, ${lng.toFixed(5)})`);
                }
            });

            await initUserLocation();
            setupSearchAutocomplete();
        });

        function setupSearchAutocomplete() {
            const searchInput = document.getElementById('destinationSearch');
            const resultsContainer = document.getElementById('searchResults');
            const clearBtn = document.getElementById('clearSearchBtn');
            let debounceTimer = null;

            async function searchLocation(query) {
                if (!query || query.length < 2) return;

                resultsContainer.innerHTML = `
                    <div class="p-3 text-center text-xs text-slate-500 font-medium flex items-center justify-center space-x-2">
                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-primary"></i>
                        <span>กำลังค้นหาสถานที่...</span>
                    </div>
                `;
                lucide.createIcons();
                resultsContainer.classList.remove('hidden');

                try {
                    // ปรับค้นหาแบบกว้างทั่วประเทศไทย เพื่อให้เจอสถานที่ง่ายขึ้น
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=th&limit=10&accept-language=th`;
                    
                    const res = await fetch(url);
                    const results = await res.json();

                    resultsContainer.innerHTML = '';

                    if (!results || results.length === 0) {
                        resultsContainer.innerHTML = `
                            <div class="p-3 text-center text-xs text-slate-500 font-medium">
                                <p class="text-rose-500 font-bold">ไม่พบสถานที่ที่ตรงกับคำค้นหา</p>
                                <p class="text-[10px] text-slate-400 mt-0.5">แนะนำ: ลองเว้นวรรค เช่น "บิ๊กซี วงศ์สว่าง" หรือปักหมุดบนแผนที่</p>
                            </div>
                        `;
                        return;
                    }

                    results.forEach(place => {
                        const nameParts = place.display_name.split(',');
                        const mainName = nameParts[0];
                        const subName = nameParts.slice(1, 3).join(',').trim();

                        const item = document.createElement('div');
                        item.className = 'p-2.5 hover:bg-amber-50 cursor-pointer text-xs transition flex items-start space-x-2.5 border-b border-slate-100 last:border-0';
                        item.innerHTML = `
                            <div class="w-7 h-7 rounded-lg bg-amber-100 text-primary flex items-center justify-center shrink-0 mt-0.5">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                            </div>
                            <div class="flex-grow min-w-0">
                                <p class="font-bold text-slate-900 truncate">${mainName}</p>
                                <p class="text-[10px] text-slate-400 truncate mt-0.5">${subName || 'ประเทศไทย'}</p>
                            </div>
                        `;
                        item.onclick = () => selectDestination(parseFloat(place.lat), parseFloat(place.lon), place.display_name);
                        resultsContainer.appendChild(item);
                    });
                    lucide.createIcons();

                } catch (err) {
                    resultsContainer.innerHTML = `<div class="p-3 text-xs text-rose-500 text-center">เกิดข้อผิดพลาดในการดึงข้อมูลสถานที่</div>`;
                }
            }

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                
                if (query.length > 0) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                    resultsContainer.classList.add('hidden');
                    return;
                }

                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => searchLocation(query), 400);
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    clearTimeout(debounceTimer);
                    searchLocation(searchInput.value.trim());
                }
            });

            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !resultsContainer.contains(e.target)) {
                    resultsContainer.classList.add('hidden');
                }
            });
        }

        function clearSearchInput() {
            document.getElementById('destinationSearch').value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            document.getElementById('searchResults').classList.add('hidden');
        }

        function createUserPulseMarker(lat, lng) {
            const icon = L.divIcon({
                className: 'custom-leaflet-marker',
                html: `<div class="user-pulse-marker"></div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            if (mapMarkers['user']) {
                mapMarkers['user'].setLatLng([lat, lng]);
            } else {
                mapMarkers['user'] = L.marker([lat, lng], { icon }).addTo(leafletMap).bindPopup('ตำแหน่งของคุณ');
            }
        }

        async function initUserLocation() {
            document.getElementById('pickupText').innerText = 'กำลังระบุที่อยู่จากสัญญาณ GPS...';
            try {
                const pos = await requestLocationPermission();
                userLat = pos.latitude;
                userLng = pos.longitude;
                setMapCenter(userLat, userLng, 16);
                createUserPulseMarker(userLat, userLng);

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLat}&lon=${userLng}&accept-language=th`);
                    const data = await res.json();
                    document.getElementById('pickupText').innerText = data.display_name || `พิกัดจริง (${userLat.toFixed(5)}, ${userLng.toFixed(5)})`;
                } catch (e) {
                    document.getElementById('pickupText').innerText = `พิกัดจริง (${userLat.toFixed(5)}, ${userLng.toFixed(5)})`;
                }

                loadNearbyDrivers();
            } catch (err) {
                setMapCenter(userLat, userLng, 14);
                createUserPulseMarker(userLat, userLng);
                document.getElementById('pickupText').innerText = `กรุงเทพมหานคร (พิกัดเริ่มต้น)`;
                loadNearbyDrivers();
            }
        }

        function centerToCurrentLocation() {
            initUserLocation();
        }

        async function loadNearbyDrivers() {
            try {
                // แก้การดึงข้อมูลเพื่อป้องกัน Supabase Syntax Error 400
                const { data: drivers, error } = await supabaseClient
                    .from('drivers')
                    .select('*')
                    .eq('approval_status', 'approved')
                    .eq('online_status', 'online');

                if (error) {
                    console.error('Fetch drivers error:', error);
                    document.getElementById('nearbyCount').innerText = `ไม่พบวินในพื้นที่ใกล้เคียง`;
                    return;
                }

                if (drivers && drivers.length > 0) {
                    document.getElementById('nearbyCount').innerText = `พบวินมอเตอร์ไซค์พร้อมรับงาน ${drivers.length} คัน`;
                    drivers.forEach(d => {
                        const latOffset = (Math.random() - 0.5) * 0.008;
                        const lngOffset = (Math.random() - 0.5) * 0.008;
                        addMarker(`driver_${d.id}`, userLat + latOffset, userLng + lngOffset, `วินมอเตอร์ไซค์ (${d.license_number || 'พร้อมรับงาน'})`, 'driver');
                    });
                } else {
                    document.getElementById('nearbyCount').innerText = `ยังไม่มีวินเปิดรับงานในขณะนี้`;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('nearbyCount').innerText = `กำลังค้นหาวินในพื้นที่...`;
            }
        }

        async function selectDestination(lat, lon, name) {
            destLat = lat;
            destLng = lon;
            document.getElementById('destinationText').innerText = name;
            document.getElementById('destinationSearch').value = name;
            document.getElementById('clearSearchBtn').classList.remove('hidden');
            document.getElementById('searchResults').classList.add('hidden');
            
            addMarker('destination', lat, lon, name, 'destination');
            await calculateRoadRoute(userLat, userLng, lat, lon);
        }

        async function calculateRoadRoute(startLat, startLng, endLat, endLng) {
            document.getElementById('distanceText').innerText = 'กำลังคำนวณเส้นทาง...';
            document.getElementById('fareText').innerText = '...';
            document.getElementById('fareInfoBox').classList.remove('hidden');

            const btn = document.getElementById('bookBtn');
            btn.disabled = true;
            btn.className = 'w-full mt-3 py-3 bg-slate-200 text-slate-400 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-2 cursor-not-allowed';
            btn.innerHTML = `<span>กำลังคำนวณค่าโดยสาร...</span>`;

            try {
                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${endLng},${endLat}?overview=full&geometries=geojson`;
                const response = await fetch(osrmUrl);
                const data = await response.json();

                if (data.code === 'Ok' && data.routes.length > 0) {
                    const route = data.routes[0];
                    estimatedDistance = route.distance / 1000;
                    const durationMinutes = Math.max(1, Math.round(route.duration / 60));

                    const baseFare = 30;
                    const pricePerKm = 10;

                    estimatedPrice = baseFare + (estimatedDistance * pricePerKm);

                    document.getElementById('distanceText').innerText = `${estimatedDistance.toFixed(2)} กม. (~${durationMinutes} นาที)`;
                    document.getElementById('fareText').innerText = formatCurrency(estimatedPrice);

                    if (routeLayer) leafletMap.removeLayer(routeLayer);

                    const coordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
                    routeLayer = L.polyline(coordinates, {
                        color: '#F59E0B',
                        weight: 5,
                        opacity: 0.85,
                        lineCap: 'round',
                        lineJoin: 'round'
                    }).addTo(leafletMap);

                    leafletMap.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

                    btn.disabled = false;
                    btn.className = 'w-full mt-3 py-3 bg-primary hover:bg-primary-dark text-white text-xs font-extrabold rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center space-x-2 cursor-pointer active:scale-[0.98]';
                    btn.innerHTML = `<span>ยืนยันเรียกรถทันที (${formatCurrency(estimatedPrice)})</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                    lucide.createIcons();
                } else {
                    throw new Error('ไม่พบเส้นทางถนน');
                }
            } catch (err) {
                estimatedDistance = calculateDistance(startLat, startLng, endLat, endLng) / 1000;
                estimatedPrice = 30 + (estimatedDistance * 10);

                document.getElementById('distanceText').innerText = `${estimatedDistance.toFixed(2)} กม. (ประมาณการทางตรง)`;
                document.getElementById('fareText').innerText = formatCurrency(estimatedPrice);

                btn.disabled = false;
                btn.className = 'w-full mt-3 py-3 bg-primary hover:bg-primary-dark text-white text-xs font-extrabold rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center space-x-2 cursor-pointer active:scale-[0.98]';
                btn.innerHTML = `<span>ยืนยันเรียกรถทันที (${formatCurrency(estimatedPrice)})</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                lucide.createIcons();
            }
        }

        async function confirmBooking() {
            if (!destLat || !destLng) {
                Swal.fire({
                    icon: 'warning',
                    title: 'กรุณาเลือกปลายทาง',
                    text: 'ค้นหาหรือปักหมุดตำแหน่งปลายทางบนแผนที่ก่อนเรียกรถ',
                    confirmButtonColor: '#F59E0B',
                    width: '90%',
                    customClass: { popup: 'rounded-2xl max-w-sm p-4' }
                });
                return;
            }

            Swal.fire({
                title: 'ยืนยันการเรียกรถ?',
                text: `ค่าโดยสารประมาณ ${formatCurrency(estimatedPrice)}`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'เรียกรถทันที',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#F59E0B',
                cancelButtonColor: '#64748B',
                width: '90%',
                customClass: {
                    popup: 'rounded-2xl max-w-sm p-4',
                    title: 'text-base font-black text-slate-900',
                    htmlContainer: 'text-xs text-slate-600',
                    confirmButton: 'px-4 py-2.5 text-xs font-bold rounded-xl shadow-md',
                    cancelButton: 'px-4 py-2.5 text-xs font-bold rounded-xl'
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const jobPayload = {
                            customer_id: currentUser.id,
                            pickup: document.getElementById('pickupText').innerText || 'จุดรับปัจจุบัน',
                            destination: document.getElementById('destinationText').innerText || 'จุดหมายปลายทาง',
                            pickup_latitude: parseFloat(userLat),
                            pickup_longitude: parseFloat(userLng),
                            destination_latitude: parseFloat(destLat),
                            destination_longitude: parseFloat(destLng),
                            price: parseFloat(estimatedPrice),
                            status: 'waiting'
                        };

                        const { data, error } = await supabaseClient
                            .from('jobs')
                            .insert([jobPayload])
                            .select()
                            .single();

                        if (error) throw error;

                        Swal.fire({
                            icon: 'success',
                            title: 'ส่งคำขอเรียกรถสำเร็จ',
                            text: 'กำลังเชื่อมต่อกับวินที่อยู่ใกล้ที่สุด...',
                            timer: 1500,
                            showConfirmButton: false,
                            width: '90%',
                            customClass: { popup: 'rounded-2xl max-w-sm p-4' }
                        }).then(() => {
                            window.location.href = 'active-job.html';
                        });
                    } catch (err) {
                        console.error('Supabase Booking Error:', err);
                        Swal.fire({ 
                            icon: 'error', 
                            title: 'เกิดข้อผิดพลาดในการเรียกรถ', 
                            text: err.message || 'ไม่สามารถสร้างรายการเรียกรถได้ กรุณาลองใหม่อีกครั้ง',
                            confirmButtonColor: '#F59E0B',
                            width: '90%',
                            customClass: { popup: 'rounded-2xl max-w-sm p-4' }
                        });
                    }
                }
            });
        }
    </script>
</body>
</html>
