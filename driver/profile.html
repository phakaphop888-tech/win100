<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ผู้ขับ - วิน100</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: { DEFAULT: '#F59E0B', dark: '#D97706' } } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between text-slate-800">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200/80 h-16 flex items-center justify-between px-4 sm:px-8 sticky top-0 z-30">
        <div class="flex items-center space-x-3">
            <a href="dashboard.html" class="p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="text-base font-black text-slate-900 tracking-tight">โปรไฟล์ผู้ขับวิน</h1>
                <p class="text-[10px] text-slate-500 font-semibold">ข้อมูลบัญชีและรถจักรยานยนต์</p>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-xl w-full mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- Driver Profile Header -->
        <div class="bg-white rounded-3xl p-6 border border-slate-200/90 shadow-xl text-center space-y-4">
            <div class="w-20 h-20 bg-amber-500 text-white font-black text-2xl rounded-3xl mx-auto flex items-center justify-center shadow-lg shadow-amber-500/20" id="avatarBox">
                D
            </div>
            <div>
                <h2 class="text-xl font-black text-slate-900" id="driverName">กำลังโหลด...</h2>
                <p class="text-xs text-slate-500 font-medium" id="driverPhone">loading...</p>
            </div>
            <div id="approvalBadge" class="inline-flex items-center space-x-1.5 px-3 py-1 bg-amber-50 border border-amber-200 rounded-full text-xs font-extrabold text-amber-700">
                <i data-lucide="clock" class="w-4 h-4"></i>
                <span>รอการอนุมัติสิทธิ์</span>
            </div>
        </div>

        <!-- Vehicle Details Card -->
        <div class="bg-white rounded-3xl p-6 border border-slate-200/90 shadow-xl space-y-4">
            <h3 class="text-sm font-black text-slate-900 uppercase tracking-wider flex items-center space-x-2 border-b border-slate-100 pb-3">
                <i data-lucide="bike" class="w-4 h-4 text-primary"></i>
                <span>ข้อมูลรถจักรยานยนต์ที่ลงทะเบียน</span>
            </h3>

            <div class="space-y-3 text-xs">
                <div class="flex justify-between border-b border-slate-100 pb-2">
                    <span class="text-slate-500">ยี่ห้อ / รุ่น:</span>
                    <span id="vehicleBrandModel" class="font-bold text-slate-800">-</span>
                </div>
                <div class="flex justify-between border-b border-slate-100 pb-2">
                    <span class="text-slate-500">ป้ายทะเบียน:</span>
                    <span id="vehiclePlate" class="font-bold text-slate-800">-</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-500">สถานะการทำงาน:</span>
                    <span id="onlineStatusText" class="font-bold text-slate-800">-</span>
                </div>
            </div>
        </div>

        <!-- Logout Action -->
        <button onclick="logoutUser()" class="w-full py-4 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-2xl text-xs border border-rose-200 transition flex items-center justify-center space-x-2">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span>ออกจากระบบ</span>
        </button>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="md:hidden bg-white border-t border-slate-200 h-16 flex items-center justify-around px-2 z-30 shrink-0 shadow-lg">
        <a href="dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-primary transition font-semibold">
            <i data-lucide="map" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1">แผนที่</span>
        </a>
        <a href="jobs.html" class="flex flex-col items-center text-slate-400 hover:text-primary transition font-semibold">
            <i data-lucide="bike" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1">รับงาน</span>
        </a>
        <a href="earnings.html" class="flex flex-col items-center text-slate-400 hover:text-primary transition font-semibold">
            <i data-lucide="wallet" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1">รายได้</span>
        </a>
        <a href="notifications.html" class="flex flex-col items-center text-slate-400 hover:text-primary transition font-semibold">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1">แจ้งเตือน</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center text-primary font-bold">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1">โปรไฟล์</span>
        </a>
    </nav>

    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = await checkAuth('driver');
            if (!auth) return;

            lucide.createIcons();

            document.getElementById('driverName').innerText = auth.profile.full_name || 'ผู้ขับขี่';
            document.getElementById('driverPhone').innerText = auth.profile.phone || '-';
            document.getElementById('avatarBox').innerText = (auth.profile.full_name || 'D').charAt(0).toUpperCase();

            // ค้นหาข้อมูลคนขับด้วย user_id
            const { data: driver, error } = await supabaseClient
                .from('drivers')
                .select('*')
                .eq('user_id', auth.profile.id) // แก้ไขจุดนี้จาก 'id' เป็น 'user_id'
                .maybeSingle();

            if (driver) {
                document.getElementById('vehicleBrandModel').innerText = `${driver.vehicle_brand || ''} ${driver.vehicle_model || ''}`;
                document.getElementById('vehiclePlate').innerText = `${driver.license_plate || '-'} ${driver.province || ''}`;
                document.getElementById('onlineStatusText').innerText = driver.online_status === 'online' ? 'ออนไลน์' : 'ออฟไลน์';

                const badge = document.getElementById('approvalBadge');
                if (driver.approval_status === 'approved') {
                    badge.className = 'inline-flex items-center space-x-1.5 px-3 py-1 bg-emerald-50 border border-emerald-200 rounded-full text-xs font-extrabold text-emerald-700';
                    badge.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4"></i><span>อนุมัติสิทธิ์การรับงานแล้ว</span>`;
                } else if (driver.approval_status === 'rejected') {
                    badge.className = 'inline-flex items-center space-x-1.5 px-3 py-1 bg-rose-50 border border-rose-200 rounded-full text-xs font-extrabold text-rose-700';
                    badge.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4"></i><span>ไม่ผ่านการอนุมัติ</span>`;
                }
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
