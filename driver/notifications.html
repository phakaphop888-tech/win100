<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การแจ้งเตือนผู้ขับ - วิน100</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: { DEFAULT: '#F59E0B', dark: '#D97706' } } }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between text-slate-800">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200/80 h-16 flex items-center justify-between px-4 sm:px-8 sticky top-0 z-30">
        <div class="flex items-center space-x-3">
            <a href="dashboard.html" class="p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="text-base font-black text-slate-900 tracking-tight">ประกาศ & การแจ้งเตือนคนขับ</h1>
                <p class="text-[10px] text-slate-500 font-semibold">ข่าวสารจากศูนย์ผู้ดูแลระบบวิน100</p>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-xl w-full mx-auto p-4 sm:p-6 space-y-4">
        <div id="driverNotifContainer" class="space-y-3">
            <div class="text-center py-16 text-xs text-slate-400 font-medium">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-primary mx-auto mb-2"></i>
                กำลังโหลดการแจ้งเตือน...
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="md:hidden bg-white border-t border-slate-200 h-16 flex items-center justify-around px-2 z-30 shrink-0 shadow-lg">
        <a href="dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-primary transition font-semibold">
            <i data-lucide="map" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1">แผนที่</span>
        </a>
        <a href="jobs.html" class="flex flex-col items-center text-slate-400 hover:text-primary transition font-semibold">
            <i data-lucide="bike" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1">รับงาน</span>
        </a>
        <a href="earnings.html" class="flex flex-col items-center text-slate-400 hover:text-primary transition font-semibold">
            <i data-lucide="wallet" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1">รายได้</span>
        </a>
        <a href="notifications.html" class="flex flex-col items-center text-primary font-bold">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1">แจ้งเตือน</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center text-slate-400 hover:text-primary transition font-semibold">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1">โปรไฟล์</span>
        </a>
    </nav>

    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const auth = await checkAuth('driver');
            if (!auth) return;

            lucide.createIcons();
            await loadDriverNotifications(auth.profile.id);
        });

        async function loadDriverNotifications(userId) {
            try {
                // ดึงประกาศสำหรับ 'all' หรือ 'driver' หรือตรงกับ user_id
            const { data: list, error } = await supabaseClient
                .from('notifications')
                .select('*')
                .or(`user_id.eq.${userId},user_id.is.null`)
                .order('created_at', { ascending: false });

                if (error) throw error;

                const container = document.getElementById('driverNotifContainer');

                if (!list || list.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white rounded-3xl p-10 text-center border border-slate-200/90 shadow-sm space-y-3">
                            <i data-lucide="bell-off" class="w-10 h-10 text-slate-300 mx-auto"></i>
                            <h3 class="font-bold text-slate-800 text-sm">ยังไม่มีประกาศใหม่ในขณะนี้</h3>
                            <p class="text-xs text-slate-400">ประกาศจากศูนย์วิน100 จะแสดงที่นี่</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                container.innerHTML = '';
                list.forEach(item => {
                    let typeBadge = '';
                    let iconBg = 'bg-amber-50 text-amber-600';

                    if (item.type === 'warning') {
                        typeBadge = '<span class="px-2 py-0.5 bg-rose-50 text-rose-600 border border-rose-200 rounded-full text-[10px] font-bold">สำคัญมาก</span>';
                        iconBg = 'bg-rose-50 text-rose-600';
                    } else {
                        typeBadge = '<span class="px-2 py-0.5 bg-amber-50 text-amber-700 border border-amber-200 rounded-full text-[10px] font-bold">ประกาศระบบ</span>';
                    }

                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-2xl p-4 border border-slate-200/90 shadow-sm space-y-2';
                    card.innerHTML = `
                        <div class="flex items-start space-x-3">
                            <div class="w-9 h-9 ${iconBg} rounded-xl flex items-center justify-center shrink-0 mt-0.5">
                                <i data-lucide="megaphone" class="w-4 h-4"></i>
                            </div>
                            <div class="flex-grow space-y-1 min-w-0">
                                <div class="flex items-center justify-between">
                                    <h4 class="text-xs font-black text-slate-900 truncate">${item.title}</h4>
                                    ${typeBadge}
                                </div>
                                <p class="text-xs text-slate-600 leading-relaxed font-medium">${item.message}</p>
                                <p class="text-[10px] text-slate-400 pt-1 font-semibold">${formatDate(item.created_at)}</p>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
                lucide.createIcons();

            } catch (err) {
                console.error('Error loading driver notifications:', err);
            }
        }
    </script>
</body>
</html>
