<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิกผู้ใช้ - วิน100</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#F59E0B',
                            dark: '#D97706',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white">

    <!-- Universal Light Sticky Navbar -->
    <header class="bg-white/90 backdrop-blur-xl border-b border-slate-200/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-400 flex items-center justify-center text-white shadow-lg shadow-amber-500/25 group-hover:scale-105 transition-transform duration-300">
                    <i data-lucide="bike" class="w-6 h-6 stroke-[2.5]"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <span class="text-xl font-black tracking-tight text-slate-900">วิน<span class="text-primary">100</span></span>
                    </div>
                    <p class="text-[10px] font-semibold text-slate-400 tracking-wider">MOTORBIKE WIN</p>
                </div>
            </a>

            <!-- Desktop Links -->
            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold">
                <a href="index.html" class="text-slate-600 hover:text-slate-900 transition">หน้าแรก</a>
                <a href="login.html" class="text-slate-600 hover:text-slate-900 transition">เข้าสู่ระบบ</a>
                <a href="register.html" class="text-primary font-bold">สมัครผู้ใช้</a>
                <a href="register-driver.html" class="px-5 py-2.5 bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 font-bold rounded-xl transition">สมัครขับวิน</a>
            </nav>

            <!-- Mobile Hamburger Button -->
            <button id="hamburgerBtn" class="md:hidden p-2.5 rounded-xl bg-slate-100 text-slate-700 hover:text-slate-900 border border-slate-200 transition focus:outline-none">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Mobile Drawer Menu -->
        <div id="mobileDrawer" class="hidden md:hidden bg-white/95 border-b border-slate-200 px-4 pt-3 pb-6 space-y-3">
            <a href="index.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-100 font-semibold">
                <i data-lucide="home" class="w-5 h-5 text-slate-500"></i>
                <span>หน้าแรก</span>
            </a>
            <a href="login.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-100 font-semibold">
                <i data-lucide="log-in" class="w-5 h-5 text-slate-500"></i>
                <span>เข้าสู่ระบบ</span>
            </a>
            <a href="register.html" class="flex items-center justify-center space-x-2 px-4 py-3.5 rounded-xl bg-primary text-white font-bold shadow-lg shadow-amber-500/20">
                <i data-lucide="user-plus" class="w-5 h-5"></i>
                <span>สมัครผู้ใช้งาน</span>
            </a>
            <a href="register-driver.html" class="flex items-center justify-center space-x-2 px-4 py-3.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-800 font-bold">
                <i data-lucide="bike" class="w-5 h-5 text-primary"></i>
                <span>สมัครขับวิน</span>
            </a>
        </div>
    </header>

    <!-- Form Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 relative">
        <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200/90 shadow-2xl space-y-6 relative z-10">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-amber-50 border border-amber-200 text-primary rounded-2xl mx-auto flex items-center justify-center shadow-sm">
                    <i data-lucide="user-plus" class="w-7 h-7"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">สมัครสมาชิกผู้ใช้งาน</h2>
                <p class="text-xs text-slate-500 font-medium">สร้างบัญชีเพื่อเริ่มต้นเรียกรถจักรยานยนต์รับจ้าง</p>
            </div>

            <form id="registerForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">ชื่อจริง</label>
                        <input type="text" id="firstName" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-primary transition" placeholder="สมชาย">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">นามสกุล</label>
                        <input type="text" id="lastName" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-primary transition" placeholder="ใจดี">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">เบอร์โทรศัพท์ (10 หลัก)</label>
                    <input type="tel" id="phone" required maxlength="10" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-primary transition" placeholder="0812345678">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">อีเมล</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-primary transition" placeholder="name@example.com">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">รหัสผ่าน</label>
                    <input type="password" id="password" required minlength="6" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-primary transition" placeholder="อย่างน้อย 6 ตัวอักษร">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">ยืนยันรหัสผ่าน</label>
                    <input type="password" id="confirmPassword" required minlength="6" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-primary transition" placeholder="••••••••">
                </div>

                <button type="submit" id="submitBtn" class="w-full py-4 bg-primary hover:bg-primary-dark text-white font-bold rounded-xl shadow-lg shadow-amber-500/25 transition flex items-center justify-center space-x-2">
                    <span>สร้างบัญชีผู้ใช้</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </form>

            <div class="text-center pt-4 border-t border-slate-100 text-xs font-medium text-slate-600">
                <p>มีบัญชีผู้ใช้อยู่แล้ว? <a href="login.html" class="font-bold text-primary hover:underline">เข้าสู่ระบบ</a></p>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 font-medium">
        <p>&copy; 2026 วิน100 (MOTORBIKE WIN SYSTEM). All rights reserved.</p>
    </footer>

    <script src="js/supabase.js"></script>
    <script>
        lucide.createIcons();

        document.getElementById('hamburgerBtn').addEventListener('click', () => {
            document.getElementById('mobileDrawer').classList.toggle('hidden');
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (phone.length !== 10) {
                Swal.fire({
                    icon: 'error',
                    title: 'เบอร์โทรศัพท์ไม่ถูกต้อง',
                    text: 'กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก'
                });
                return;
            }

            if (password !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'รหัสผ่านไม่ตรงกัน',
                    text: 'กรุณากรอกรหัสผ่านทั้งสองช่องให้ตรงกัน'
                });
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>กำลังสร้างบัญชี...</span>`;
            lucide.createIcons();

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: `${firstName} ${lastName}`,
                            phone: phone,
                            role: 'user'
                        }
                    }
                });

                if (error) throw error;

                // บันทึกโปรไฟล์เสริมลงตาราง users
                if (data.user) {
                    await supabaseClient.from('users').insert([{
                        id: data.user.id,
                        email: email,
                        full_name: `${firstName} ${lastName}`,
                        phone: phone,
                        role: 'user'
                    }]);
                }

                Swal.fire({
                    icon: 'success',
                    title: 'สมัครสมาชิกสำเร็จ',
                    text: 'กรุณาเข้าสู่ระบบเพื่อเริ่มต้นใช้งาน',
                    confirmButtonColor: '#F59E0B'
                }).then(() => {
                    window.location.href = 'login.html';
                });
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: err.message
                });
                btn.disabled = false;
                btn.innerHTML = `<span>สร้างบัญชีผู้ใช้</span><i data-lucide="arrow-right" class="w-5 h-5"></i>`;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
